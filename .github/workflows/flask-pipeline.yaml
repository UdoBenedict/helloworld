name: Flask Pipeline

on: 
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push Docker image
        run: |
          IMAGE_NAME=${{ secrets.DOCKER_USERNAME }}/demo-pipeline-flask-app
          docker build -t $IMAGE_NAME:v1 -t $IMAGE_NAME:${{ github.sha }} .
          docker push $IMAGE_NAME:v1
          docker push $IMAGE_NAME:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Deploy to AWS
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.AWS_SSH_HOST }}
          username: ${{ secrets.AWS_SSH_USER }}
          key: ${{ secrets.AWS_SSH_KEY }}
          script: |
            APP_NAME=demo-pipeline-flask-app
            IMAGE_NAME=${{ secrets.DOCKER_USERNAME }}/demo-pipeline-flask-app
            docker pull $IMAGE_NAME:v1
            docker stop $APP_NAME 2>>/dev/null || true
            docker rm $APP_NAME 2>>/dev/null || true
            docker run -d --name $APP_NAME -p 5000:5000 $IMAGE_NAME:v1

            sleep 4

            if curl -f http://${{ secrets.AWS_SSH_HOST }}:5000/health; then
              echo "🎉 Deployment successful!"
              docker image prune -f
            else
              echo "❌ Health check failed!"
              docker logs $APP_NAME
              exit 1
            fi








